<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/>
    </marker>
    <linearGradient id="glow3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="500" fill="#10151f"/>
  <rect width="800" height="500" fill="url(#glow3)"/>

  <!-- title bar -->
  <rect x="0" y="0" width="800" height="46" fill="#141b28"/>
  <line x1="0" y1="46" x2="800" y2="46" stroke="#212a3a" stroke-width="1"/>
  <circle cx="26" cy="23" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="23" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="23" r="6" fill="#27c93f"/>
  <text x="740" y="27" text-anchor="end" font-size="13" fill="#616d82">ontology.yml</text>

  <!-- Unity Catalog -->
  <g>
    <rect x="40" y="205" width="150" height="110" rx="12" fill="#141b28" stroke="#212a3a"/>
    <text x="115" y="250" text-anchor="middle" font-size="14" fill="#e7ebf3" font-weight="600">Unity</text>
    <text x="115" y="268" text-anchor="middle" font-size="14" fill="#e7ebf3" font-weight="600">Catalog</text>
    <text x="115" y="290" text-anchor="middle" font-size="11" fill="#9aa5b8">Tabelas · Colunas</text>
  </g>

  <!-- Ontology semantic layer -->
  <g>
    <rect x="240" y="170" width="190" height="180" rx="12" fill="#141b28" stroke="#5b8cff" stroke-opacity="0.45"/>
    <circle cx="335" cy="225" r="16" fill="none" stroke="#5b8cff" stroke-width="2.5"/>
    <circle cx="300" cy="260" r="12" fill="none" stroke="#5b8cff" stroke-width="2.5"/>
    <circle cx="370" cy="260" r="12" fill="none" stroke="#5b8cff" stroke-width="2.5"/>
    <line x1="323" y1="234" x2="308" y2="252" stroke="#5b8cff" stroke-width="2"/>
    <line x1="347" y1="234" x2="362" y2="252" stroke="#5b8cff" stroke-width="2"/>
    <line x1="312" y1="260" x2="358" y2="260" stroke="#5b8cff" stroke-width="2"/>
    <text x="335" y="300" text-anchor="middle" font-size="13.5" fill="#e7ebf3" font-weight="600">Ontology</text>
    <text x="335" y="318" text-anchor="middle" font-size="11" fill="#9aa5b8">camada semântica</text>
  </g>

  <!-- Genie -->
  <g>
    <rect x="480" y="150" width="170" height="200" rx="12" fill="#141b28" stroke="#3ddc97" stroke-opacity="0.45"/>
    <circle cx="565" cy="215" r="26" fill="none" stroke="#3ddc97" stroke-width="2.5"/>
    <circle cx="565" cy="215" r="6" fill="#3ddc97"/>
    <line x1="565" y1="189" x2="565" y2="175" stroke="#3ddc97" stroke-width="2.5"/>
    <line x1="591" y1="215" x2="605" y2="215" stroke="#3ddc97" stroke-width="2.5"/>
    <line x1="565" y1="241" x2="565" y2="255" stroke="#3ddc97" stroke-width="2.5"/>
    <line x1="539" y1="215" x2="525" y2="215" stroke="#3ddc97" stroke-width="2.5"/>
    <text x="565" y="290" text-anchor="middle" font-size="14" fill="#e7ebf3" font-weight="600">Databricks</text>
    <text x="565" y="308" text-anchor="middle" font-size="14" fill="#e7ebf3" font-weight="600">Genie</text>
  </g>

  <!-- Natural language question -->
  <g>
    <rect x="700" y="200" width="60" height="110" rx="10" fill="#0d1220" stroke="#212a3a"/>
    <text x="730" y="240" text-anchor="middle" font-size="20" fill="#9aa5b8">?</text>
  </g>

  <!-- arrows -->
  <line x1="190" y1="255" x2="235" y2="255" stroke="#3ddc97" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="430" y1="255" x2="475" y2="255" stroke="#3ddc97" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- footer terminal line -->
  <text x="40" y="390" font-size="13" fill="#5b8cff">&gt;</text>
  <text x="58" y="390" font-size="13" fill="#9aa5b8">"Qual foi o faturamento do último trimestre?"</text>

  <text x="40" y="450" font-size="16" fill="#e7ebf3" font-weight="600">Consultas em Linguagem Natural — Genie + Ontology</text>
  <text x="40" y="472" font-size="12.5" fill="#9aa5b8">Camada semântica no Unity Catalog alimentando o Databricks Genie para perguntas em linguagem natural.</text>
</svg>
