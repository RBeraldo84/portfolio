<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/>
    </marker>
    <linearGradient id="glow2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="500" fill="#10151f"/>
  <rect width="800" height="500" fill="url(#glow2)"/>

  <!-- title bar -->
  <rect x="0" y="0" width="800" height="46" fill="#141b28"/>
  <line x1="0" y1="46" x2="800" y2="46" stroke="#212a3a" stroke-width="1"/>
  <circle cx="26" cy="23" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="23" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="23" r="6" fill="#27c93f"/>
  <text x="740" y="27" text-anchor="end" font-size="13" fill="#616d82">app.py</text>

  <!-- Delta / Unity Catalog -->
  <g>
    <rect x="60" y="190" width="180" height="130" rx="12" fill="#141b28" stroke="#212a3a"/>
    <rect x="90" y="222" width="120" height="18" rx="3" fill="#5b8cff" fill-opacity="0.35"/>
    <rect x="90" y="248" width="120" height="18" rx="3" fill="#5b8cff" fill-opacity="0.22"/>
    <rect x="90" y="274" width="80" height="18" rx="3" fill="#5b8cff" fill-opacity="0.22"/>
    <text x="150" y="212" text-anchor="middle" font-size="13.5" fill="#e7ebf3" font-weight="600">Unity Catalog</text>
    <text x="150" y="310" text-anchor="middle" font-size="11" fill="#9aa5b8">Delta Tables</text>
  </g>

  <!-- Databricks App / Streamlit -->
  <g>
    <rect x="310" y="150" width="220" height="210" rx="12" fill="#141b28" stroke="#3ddc97" stroke-opacity="0.45"/>
    <rect x="330" y="170" width="180" height="26" rx="6" fill="#0d1220"/>
    <circle cx="344" cy="183" r="4" fill="#ff5f56"/>
    <circle cx="358" cy="183" r="4" fill="#ffbd2e"/>
    <circle cx="372" cy="183" r="4" fill="#27c93f"/>
    <rect x="330" y="208" width="180" height="46" rx="6" fill="#3ddc97" fill-opacity="0.12" stroke="#3ddc97" stroke-opacity="0.3"/>
    <text x="420" y="228" text-anchor="middle" font-size="11" fill="#9aa5b8">Meta do mês</text>
    <text x="420" y="245" text-anchor="middle" font-size="15" fill="#3ddc97" font-weight="700">92%</text>
    <rect x="330" y="262" width="84" height="70" rx="6" fill="#0d1220"/>
    <rect x="422" y="262" width="88" height="70" rx="6" fill="#0d1220"/>
    <polyline points="336,318 350,300 364,308 378,286 400,296" fill="none" stroke="#5b8cff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="430" y="300" width="12" height="24" fill="#5b8cff" fill-opacity="0.6"/>
    <rect x="448" y="286" width="12" height="38" fill="#5b8cff" fill-opacity="0.6"/>
    <rect x="466" y="308" width="12" height="16" fill="#5b8cff" fill-opacity="0.6"/>
    <rect x="484" y="292" width="12" height="32" fill="#5b8cff" fill-opacity="0.6"/>
    <text x="420" y="348" text-anchor="middle" font-size="14" fill="#e7ebf3" font-weight="600">Streamlit</text>
  </g>

  <!-- Databricks Apps badge -->
  <g>
    <rect x="600" y="205" width="150" height="100" rx="12" fill="#141b28" stroke="#212a3a"/>
    <path d="M675 224 L653 248 L668 248 L657 270 L697 240 L680 240 Z" fill="#5b8cff"/>
    <text x="675" y="288" text-anchor="middle" font-size="12.5" fill="#e7ebf3" font-weight="600">Databricks</text>
    <text x="675" y="300" text-anchor="middle" font-size="11" fill="#9aa5b8">Apps</text>
  </g>

  <!-- arrows -->
  <line x1="240" y1="255" x2="305" y2="255" stroke="#3ddc97" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="530" y1="255" x2="595" y2="255" stroke="#3ddc97" stroke-width="2" marker-end="url(#arrow2)"/>

  <text x="40" y="450" font-size="16" fill="#e7ebf3" font-weight="600">Sales Dashboard — Databricks Apps + Streamlit</text>
  <text x="40" y="472" font-size="12.5" fill="#9aa5b8">Data app publicado como Databricks App, lendo tabelas Delta via Unity Catalog.</text>
</svg>
